# Every pull request and every push to main: the test suite, then both builds of the same code (the download and the Mac
# App Store variant, which differs only in having no update check). The repository is public, so these runs are free.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE', '.gitignore']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE', '.gitignore']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel a run on main

permissions:
  contents: read

jobs:
  test-and-build:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Tests
        run: swift test
      - name: Download build
        run: swift build -c release
      - name: App Store build
        run: swift build -c release -Xswiftc -DAPPSTORE
      - name: The App Store build has no update check
        run: |
          if grep -qaF "Check for a new version once a day" .build/release/Nightwatch; then
            echo "The App Store build still contains the update check"; exit 1
          fi
