name: Build Intel / Universal

on:
  push:
    branches:
      - main
      - intel-build
      - intel

  pull_request:
    branches:
      - main
      - intel-build
      - intel

  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture(s) to build"
        required: false
        default: "universal"
        type: choice
        options:
          - universal
          - intel

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      package_name: ${{ steps.arch.outputs.package_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          uname -a

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --quiet

      - name: Pin SwiftPM dependencies
        run: |
          PINS="Nightwatch.xcodeproj/project.xcworkspace/xcshareddata/swiftpm"

          mkdir -p "$PINS"
          cp Package.resolved "$PINS/"

      - name: Select build architecture
        id: arch
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.arch }}" == "intel" ]]; then
            echo "build_archs=x86_64" >> "$GITHUB_OUTPUT"
            echo "package_name=Nightwatch-macOS-Intel-x86_64" >> "$GITHUB_OUTPUT"
          else
            echo "build_archs=arm64 x86_64" >> "$GITHUB_OUTPUT"
            echo "package_name=Nightwatch-macOS-Universal" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Nightwatch
        run: |
          BUILD_ARCHS="${{ steps.arch.outputs.build_archs }}"

          echo "Building architectures: $BUILD_ARCHS"

          xcodebuild \
            -project Nightwatch.xcodeproj \
            -scheme Nightwatch \
            -configuration Release \
            -derivedDataPath build/xcode \
            -onlyUsePackageVersionsFromResolvedFile \
            ARCHS="$BUILD_ARCHS" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify binary architectures
        run: |
          BIN="build/xcode/Build/Products/Release/Nightwatch.app/Contents/MacOS/Nightwatch"

          echo "Binary information:"
          file "$BIN"

          echo
          echo "Architectures:"
          lipo -info "$BIN"

          echo
          echo "Expected architectures:"
          echo "${{ steps.arch.outputs.build_archs }}"

      - name: Ad-hoc sign Nightwatch
        run: |
          APP="build/xcode/Build/Products/Release/Nightwatch.app"

          rm -rf "$APP/Contents/PlugIns"
          rm -rf "$APP/Contents/XPCServices"

          cat > Nightwatch.entitlements <<'ENT'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.personal-information.location</key>
            <true/>

            <key>com.apple.security.app-sandbox</key>
            <true/>

            <key>com.apple.security.network.client</key>
            <true/>

            <key>com.apple.security.temporary-exception.files.home-relative-path.read-only</key>
            <array>
              <string>/Library/Application Support/Nightwatch/</string>
              <string>/Library/Caches/Nightwatch/</string>
            </array>

            <key>com.apple.security.files.user-selected.read-only</key>
            <true/>
          </dict>
          </plist>
          ENT

          /usr/libexec/PlistBuddy \
            -c "Delete :NightwatchAppGroup" \
            "$APP/Contents/Info.plist" || true

          codesign \
            --force \
            --sign - \
            --entitlements Nightwatch.entitlements \
            "$APP"

          codesign \
            --verify \
            --verbose \
            "$APP"

          echo "Ad-hoc signature OK"

      - name: Verify final app
        run: |
          APP="build/xcode/Build/Products/Release/Nightwatch.app"
          BIN="$APP/Contents/MacOS/Nightwatch"

          echo "Checking code signature..."
          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"

          echo
          echo "Checking architectures..."
          lipo -info "$BIN"

          echo
          echo "Checking binary format..."
          file "$BIN"

      - name: Package Nightwatch
        run: |
          APP="build/xcode/Build/Products/Release/Nightwatch.app"
          PACKAGE="${{ steps.arch.outputs.package_name }}.zip"

          echo "Creating package: $PACKAGE"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP" \
            "$PACKAGE"

          echo
          echo "Package created:"
          ls -lh "$PACKAGE"

          echo
          echo "Package contents:"
          unzip -l "$PACKAGE" > package-contents.txt
          head -50 package-contents.txt

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.arch.outputs.package_name }}
          path: ${{ steps.arch.outputs.package_name }}.zip
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download packaged app
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.package_name }}
          path: release

      - name: Create release and upload app
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}
          PACKAGE_NAME: ${{ needs.build.outputs.package_name }}
          COMMIT_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PACKAGE="release/${PACKAGE_NAME}.zip"
          test -s "$PACKAGE"

          cat > release-notes.md <<EOF
          Automated build from \`${SOURCE_REF}\` (\`${COMMIT_SHA}\`).

          Download \`${PACKAGE_NAME}.zip\` below and extract Nightwatch.app.

          This build is ad-hoc signed, not notarised by Apple. macOS may block it on first launch.
          The desktop widget and helper are not included.

          [Build logs](${RUN_URL})
          EOF

          RELEASE_URL=$(gh release create "$RELEASE_TAG" "$PACKAGE" \
            --target "$COMMIT_SHA" \
            --title "Nightwatch ${RELEASE_TAG}" \
            --notes-file release-notes.md \
            --prerelease \
            --latest=false)

          printf '### GitHub Release\n\n[%s](%s)\n' "$RELEASE_TAG" "$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
