name: Build macOS ARM / Intel

on:
  push:
    branches:
      - main
      - intel-build
      - intel
      - chinese-translation

  pull_request:
    branches:
      - main
      - intel-build
      - intel

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            package_name: Nightwatch-macOS-AppleSilicon-arm64
          - arch: x86_64
            package_name: Nightwatch-macOS-Intel-x86_64
    env:
      BUILD_ARCH: ${{ matrix.arch }}
      PACKAGE_NAME: ${{ matrix.package_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          uname -a

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --quiet

      - name: Pin SwiftPM dependencies
        run: |
          PINS="Nightwatch.xcodeproj/project.xcworkspace/xcshareddata/swiftpm"

          mkdir -p "$PINS"
          cp Package.resolved "$PINS/"

      - name: Check localization resources
        run: node scripts/check-localization.mjs

      - name: Build Nightwatch
        run: |
          echo "Building architecture: $BUILD_ARCH"

          xcodebuild \
            -project Nightwatch.xcodeproj \
            -scheme Nightwatch \
            -configuration Release \
            -derivedDataPath build/xcode \
            -onlyUsePackageVersionsFromResolvedFile \
            ARCHS="$BUILD_ARCH" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify binary architectures
        run: |
          BIN="build/xcode/Build/Products/Release/Nightwatch.app/Contents/MacOS/Nightwatch"

          echo "Binary information:"
          file "$BIN"

          echo
          echo "Architectures:"
          lipo -info "$BIN"

          echo
          echo "Expected architecture: $BUILD_ARCH"
          ACTUAL_ARCHS="$(lipo -archs "$BIN")"
          if [[ "$ACTUAL_ARCHS" != "$BUILD_ARCH" ]]; then
            echo "::error::Expected $BUILD_ARCH, got $ACTUAL_ARCHS"
            exit 1
          fi

      - name: Ad-hoc sign Nightwatch
        run: |
          APP="build/xcode/Build/Products/Release/Nightwatch.app"

          rm -rf "$APP/Contents/PlugIns"
          rm -rf "$APP/Contents/XPCServices"

          cat > Nightwatch.entitlements <<'ENT'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.personal-information.location</key>
            <true/>

            <key>com.apple.security.app-sandbox</key>
            <true/>

            <key>com.apple.security.network.client</key>
            <true/>

            <key>com.apple.security.temporary-exception.files.home-relative-path.read-only</key>
            <array>
              <string>/Library/Application Support/Nightwatch/</string>
              <string>/Library/Caches/Nightwatch/</string>
            </array>

            <key>com.apple.security.files.user-selected.read-only</key>
            <true/>
          </dict>
          </plist>
          ENT

          /usr/libexec/PlistBuddy \
            -c "Delete :NightwatchAppGroup" \
            "$APP/Contents/Info.plist" || true

          codesign \
            --force \
            --sign - \
            --entitlements Nightwatch.entitlements \
            "$APP"

          codesign \
            --verify \
            --verbose \
            "$APP"

          echo "Ad-hoc signature OK"

      - name: Verify final app
        run: |
          APP="build/xcode/Build/Products/Release/Nightwatch.app"
          BIN="$APP/Contents/MacOS/Nightwatch"

          echo "Checking code signature..."
          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"

          echo
          echo "Checking architecture..."
          # -verify_arch consumes all following arguments as architecture names.
          lipo "$BIN" -verify_arch "$BUILD_ARCH"

          echo
          echo "Checking binary format..."
          file "$BIN"

      - name: Package Nightwatch
        run: |
          APP="build/xcode/Build/Products/Release/Nightwatch.app"
          PACKAGE="${PACKAGE_NAME}.zip"

          echo "Creating package: $PACKAGE"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP" \
            "$PACKAGE"

          echo
          echo "Package created:"
          ls -lh "$PACKAGE"

          echo
          echo "Package contents:"
          unzip -l "$PACKAGE" > package-contents.txt
          head -50 package-contents.txt

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_name }}
          path: ${{ matrix.package_name }}.zip
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download both packaged apps
        uses: actions/download-artifact@v4
        with:
          pattern: Nightwatch-macOS-*
          merge-multiple: true
          path: release

      - name: Create release and upload both apps
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PACKAGES=(
            release/Nightwatch-macOS-AppleSilicon-arm64.zip
            release/Nightwatch-macOS-Intel-x86_64.zip
          )
          for package in "${PACKAGES[@]}"; do
            if [[ ! -s "$package" ]]; then
              echo "::error::Missing release package: $package"
              exit 1
            fi
          done

          cat > release-notes.md <<EOF
          Automated build from \`${SOURCE_REF}\` (\`${COMMIT_SHA}\`).

          Download the ZIP for your Mac and extract Nightwatch.app:

          - Apple Silicon (M-series): \`Nightwatch-macOS-AppleSilicon-arm64.zip\`
          - Intel: \`Nightwatch-macOS-Intel-x86_64.zip\`

          This build is ad-hoc signed, not notarised by Apple. macOS may block it on first launch.
          The desktop widget and helper are not included.

          [Build logs](${RUN_URL})
          EOF

          RELEASE_URL=$(gh release create "$RELEASE_TAG" "${PACKAGES[@]}" \
            --target "$COMMIT_SHA" \
            --title "Nightwatch ${RELEASE_TAG}" \
            --notes-file release-notes.md \
            --prerelease \
            --latest=false)

          printf '### GitHub Release\n\n[%s](%s)\n' "$RELEASE_TAG" "$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
