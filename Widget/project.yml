# The desktop widget's Xcode project, generated by xcodegen (brew install xcodegen). scripts/build-app.sh runs this when
# Xcode and xcodegen are present and embeds the .appex in the SwiftPM-built app. The generated .xcodeproj is not committed.
name: NightwatchWidget
options:
  deploymentTarget:
    macOS: "14.0"
packages:
  Nightwatch:
    path: ..
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # build-app.sh passes the app's version from Sources/Nightwatch/Info.plist, so the two never drift; these are fallbacks.
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "25"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  NightwatchWidget:
    type: app-extension
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: Nightwatch
        product: NightwatchUI
      - package: Nightwatch
        product: SkyCore
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Nightwatch
        CFBundleShortVersionString: $(MARKETING_VERSION)   # otherwise xcodegen writes a literal 1.0
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Must equal the app's group, which scripts/build-app.sh derives as <team>.<CFBundleIdentifier in Sources/Nightwatch/Info.plist>.
        # Change the three io.github.rsutcliffe.nightwatch strings here if that bundle ID ever changes.
        NightwatchAppGroup: $(TeamIdentifierPrefix)io.github.rsutcliffe.nightwatch
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: build/NightwatchWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)io.github.rsutcliffe.nightwatch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rsutcliffe.nightwatch.widget
