# The app and its desktop widget as one Xcode project, generated by xcodegen (brew install xcodegen). scripts/build-app.sh
# generates and builds it; the generated Nightwatch.xcodeproj is not committed. SkyCore and NightwatchUI stay Swift
# packages (Package.swift), so the tests still run with scripts/test.sh.
name: Nightwatch
options:
  deploymentTarget:
    macOS: "14.0"
packages:
  Nightwatch:
    path: .
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: YES
    # build-app.sh passes the app's version from Sources/Nightwatch/Info.plist, so the two never drift; these are fallbacks.
    MARKETING_VERSION: "1.5.4"
    CURRENT_PROJECT_VERSION: "41"
targets:
  Nightwatch:
    type: application
    platform: macOS
    sources:
      - path: Sources/Nightwatch
        excludes: [Info.plist, Nightwatch.entitlements]
      - path: Resources/Constellations   # the owner's artwork; the widget does not need it
        type: folder
        buildPhase: resources
      - path: Resources/Events           # the owner's event artwork (v1.0.1)
        type: folder
        buildPhase: resources
      - path: Resources/LightPollution   # the world light-pollution grid (#138); the widget does not need it
        type: folder
        buildPhase: resources
      - path: Resources/AppIcon/Nightwatch.icon   # Icon Composer: the Liquid Glass icon plus a classic .icns
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
    dependencies:
      - package: Nightwatch
        product: SkyCore
      - package: Nightwatch
        product: NightwatchUI
      - target: NightwatchWidget
      - target: NightwatchWidgetReset
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rsutcliffe.nightwatch
        PRODUCT_NAME: Nightwatch
        INFOPLIST_FILE: Sources/Nightwatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Nightwatch/Nightwatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: Nightwatch
  NightwatchWidget:
    type: app-extension
    platform: macOS
    sources: [Widget/Sources]
    dependencies:
      - package: Nightwatch
        product: NightwatchUI
      - package: Nightwatch
        product: SkyCore
    info:
      path: build/NightwatchWidget-Info.plist
      properties:
        CFBundleDisplayName: Nightwatch
        CFBundleShortVersionString: $(MARKETING_VERSION)   # otherwise xcodegen writes a literal 1.0
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Must equal the app's group (NightwatchAppGroup in Sources/Nightwatch/Info.plist).
        # Change the io.github.rsutcliffe.nightwatch strings here and there if that bundle ID ever changes.
        NightwatchAppGroup: $(TeamIdentifierPrefix)io.github.rsutcliffe.nightwatch
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: build/NightwatchWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)io.github.rsutcliffe.nightwatch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rsutcliffe.nightwatch.widget
  # The one piece outside the sandbox (1.5.4): it ends the old version's widget process after an update, which the app is
  # not allowed to do. No entitlements, so no sandbox. scripts/appstore.sh removes it: the Mac App Store allows none.
  NightwatchWidgetReset:
    type: xpc-service
    platform: macOS
    sources: [Helper/Sources]
    info:
      path: build/NightwatchWidgetReset-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        XPCService:
          ServiceType: Application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rsutcliffe.nightwatch.widgetreset
